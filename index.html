<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Cantoral Kerigma X Ibarra Music">
  <meta property="og:description" content="Cantoral digital del ministerio de música Kerigma, por Daniel Ibarra, Capilla de Nuestra Señora de Guadalupe, Ruiseñores, Tala, Jalisco.">
  <meta property="og:image" content="https://sagradocorazondejesus.github.io/KNMA/img/logo-kerigma.jpg">
  <meta property="og:type" content="website">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1020">
<link rel="apple-touch-icon" href="img/kerigma-icon-512.png">

  <title>Cantoral Kerigma</title>
  <link rel="icon" type="image/jpeg" href="https://sagradocorazondejesus.github.io/KNMA/img/logo-kerigma.jpg">

  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/misa.css">
</head>

<body>

<header class="encabezado">
  <img src="img/logo-kerigma.jpg" alt="Logo Kerigma" class="logo">
  <h1>Cantoral Kerigma</h1>
 <p>
  Nuevo milagro de amor · DIS 2.9
  <span class="btn-actualizar-texto"
        onclick="buscarActualizacion()"
        title="Buscar actualización">
    ⟳
  </span>
</p>

</header>

<nav class="menu-principal no-print">

  <button id="btnCantos"
          onclick="mostrarPantalla('cantos')">
    📚 Cantos
  </button>

  <button id="btnFavoritosMenu"
          onclick="mostrarPantalla('favoritos')">
    ⭐ Favoritos
  </button>

  <button id="btnMisa"
          onclick="mostrarPantalla('misa')">
    🎵 Misa de Hoy
  </button>

</nav>

<main class="contenedor">

  <div id="pantallaCantos">

    <section class="panel no-print">
      <input type="text" id="buscar" placeholder="Buscar canto...">

      <select id="filtroCategoria">
        <option value="">Todas las categorías</option>
        <option>Entrada</option>
        <option>Kyrie</option>
        <option>Gloria</option>
        <option>Aleluya</option>
        <option>Ofertorio</option>
        <option>Santo</option>
        <option>Cordero</option>
        <option>Comunion</option>
        <option>Salida</option>
        <option>Marianos</option>
        <option>Otros</option>
      </select>

      <select id="filtroTiempo">
        <option value="">Todos los tiempos</option>
        <option>Adviento</option>
        <option>Navidad</option>
        <option>Cuaresma</option>
        <option>Pascua</option>
        <option>Ordinario</option>
        <option>Mariano</option>
      </select>

      <button id="btnFavoritos" onclick="alternarVerFavoritos()">☆ Ver favoritos</button>
    </section>

    <section class="panel no-print">
      <div class="titulo-lista-cantos">
  <h2>Cantos</h2>
  <button class="btn-expandir-lista" onclick="alternarListaGrande()">⛶</button>
</div>

<p id="contadorCantos" class="contador-cantos"></p>
<div id="listaCantos" class="lista-scroll"></div>
    </section>

    <section class="panel canto">

      <div class="botones no-print">
        <button onclick="cambiarTono(-1)">-1</button>
        <button onclick="tonoOriginal()">Original</button>
        <button onclick="cambiarTono(1)">+1</button>
      </div>

      <div class="botones no-print">
        <button onclick="cambiarSistema()">Letras / Do Re Mi</button>
        <button onclick="cambiarLetra(-1)">A-</button>
        <button onclick="cambiarLetra(1)">A+</button>
        <button id="btnAcordes" onclick="alternarAcordes()">Acordes ON</button>
      </div>

      <button class="no-print" id="btnMarcarFavorito" onclick="marcarFavorito()">☆ Agregar a favoritos</button>

<button id="btnAutoScroll" onclick="toggleAutoScroll()">
    ▶ Auto
</button>

      <h2 id="tituloCanto">Selecciona un canto</h2>
      <div id="datosCanto"></div>
      <p id="tonoActual"></p>
      <div id="letraCanto" class="letra"></div>

      <button class="no-print imprimir" onclick="window.print()">Imprimir / Guardar PDF</button>
    </section>

  </div>

  <section id="pantallaFavoritos" class="panel no-print" style="display:none;">
    <h2>⭐ Favoritos</h2>
    <div id="listaFavoritos"></div>
  </section>

  <section id="pantallaMisa" class="panel no-print misa-panel" style="display:none;">
    <h2>🎵 Misa de Hoy</h2>

    <div id="selectoresMisa"></div>

    <button onclick="guardarMisaHoy()">Guardar Misa de Hoy</button>
    <button onclick="iniciarMisaHoy()">▶ Iniciar Misa</button>
<button onclick="compartirProximaMisa()">📤 Compartir Próxima Misa</button>

<button onclick="compartirImagenProximaMisa()">🖼️ Compartir imagen</button>

  </section>

  <section id="presentacionMisa" class="panel misa-presentacion" style="display:none;">

    <div class="misa-cabecera">
  <span id="misaContador">1 / 1</span>

  <button id="btnAutoScrollMisa" onclick="toggleAutoScroll()">
    ▶ Auto
  </button>

  <button onclick="cerrarPresentacionMisa()">
    ✕ Salir
  </button>
</div>

    <h2 id="misaMomento"></h2>

    <div id="misaContenido"></div>

    <div class="misa-nav">
      <button onclick="cantoAnterior()">◀ Anterior</button>
      <button onclick="cantoSiguiente()">Siguiente ▶</button>
    </div>

  </section>

</main>

<script src="js/cantos/entrada.js"></script>
<script src="js/cantos/kyrie.js"></script>
<script src="js/cantos/gloria.js"></script>
<script src="js/cantos/aleluya.js"></script>
<script src="js/cantos/ofertorio.js"></script>
<script src="js/cantos/santo.js"></script>
<script src="js/cantos/cordero.js"></script>
<script src="js/cantos/comunion.js"></script>
<script src="js/cantos/salida.js"></script>
<script src="js/cantos/marianos.js"></script>
<script src="js/cantos/otros.js"></script>
<script src="js/transpositor.js"></script>
<script src="js/app.js"></script>
<script src="js/misa.js"></script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}

function buscarActualizacion(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistration().then(reg => {
      if(reg){
        reg.update().then(() => {
          alert("Buscando actualización. La app se recargará.");
          window.location.reload();
        });
      }else{
        window.location.reload();
      }
    });
  }else{
    window.location.reload();
  }
}
</script>

</body>
</html>
