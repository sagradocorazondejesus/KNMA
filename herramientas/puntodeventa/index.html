<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Punto de Venta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">

</head>
<body>

<header>
  <h1>🥤 Punto de Venta</h1>
  <p>Refrescos y snacks</p>
</header>

<main>

  <section class="card">
    <h2>🛒 Venta rápida</h2>
    <p>Toca un producto para registrarlo como venta.</p>
    <div id="ventaRapida" class="venta-rapida"></div>
    <p id="mensaje"></p>
  </section>

  <section class="card">
    <h2>📊 Resumen</h2>

    <div class="resumen">
      <div>Total vendido<br><strong>$<span id="totalVentas">0</span></strong></div>
      <div>Ganancia<br><strong>$<span id="totalGanancia">0</span></strong></div>
      <div>Inversión<br><strong>$<span id="totalInversion">0</span></strong></div>
      <div>Tipos<br><strong><span id="totalProductos">0</span></strong></div>
      <div>Piezas vendidas<br><strong><span id="piezasVendidas">0</span></strong></div>
    </div>
  </section>

  <section class="card">
    <h2>➕ Agregar producto</h2>

    <input id="codigo" placeholder="Código o clave del producto">
    <input id="nombre" placeholder="Nombre del producto">
    <input id="costo" type="number" placeholder="Precio de compra">
    <input id="precio" type="number" placeholder="Precio de venta">
    <input id="stock" type="number" placeholder="Stock inicial">

    <button onclick="agregarProducto()">Guardar producto</button>
  </section>

  <section class="card">
    <h2>📦 Inventario</h2>
    <div id="listaProductos"></div>
  </section>

  <section class="card">
    <h2>🧾 Ventas</h2>

<button onclick="descargarRespaldo()">Descargar respaldo</button>

<input 
  type="file" 
  id="archivoRespaldo" 
  accept=".json" 
  style="display:none"
  onchange="cargarRespaldo(event)"
>

<button onclick="document.getElementById('archivoRespaldo').click()">
  Cargar respaldo
</button>

    <button onclick="exportarCSV()">Descargar Excel CSV</button>
    <button class="danger" onclick="borrarVentas()">Borrar ventas</button>

    <div id="listaVentas"></div>
  </section>

</main>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
