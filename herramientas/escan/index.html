<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escáner PDF</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<main class="app">
  <h1>📄 Escáner PDF</h1>
  <p class="sub">Escanea, guarda en imagen o PDF y comparte.</p>
 <p class="sub">DIS 7.5</p>

  <section class="card">
    <button id="btnOpenCamera" class="mainBtn">📷 Abrir cámara</button>

    <label class="mainBtn secondary">
      🖼️ Elegir imagen
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </label>

    <div class="controls">
<select id="paperSize" class="paperSelect">
  <option value="letter">Carta</option>
  <option value="legal">Oficio</option>
  <option value="a4">A4</option>
  <option value="free">Libre</option>
</select>
      <button id="btnGray">B/N</button>
      <button id="btnColor">Color</button>
      <button id="btnClear">Limpiar</button>
    </div>
  </section>

  <section id="cameraBox" class="cameraBox hidden">
    <video id="video" autoplay playsinline></video>

<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>

    <div class="guide">
      <div class="guideLine top"></div>
      <div class="guideLine right"></div>
      <div class="guideLine bottom"></div>
      <div class="guideLine left"></div>
      <span id="counter">Mantén la hoja dentro del marco</span>
    </div>

    <button id="btnCapture" class="captureBtn">Tomar ahora</button>
    <button id="btnCloseCamera" class="closeBtn">Cerrar</button>

<div id="debugInfo" class="debugInfo"></div>

  </section>

  <section id="preview" class="preview"></section>

  <section class="bottom">
    <button id="btnSaveImage">Imagen</button>
    <button id="btnPDF">PDF</button>
    <button id="btnShare">Compartir</button>
  </section>
</main>

<script src="script.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="script.js"></script>

</body>
</html>
