<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recordatorio de Ensayo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <section class="panel">
    <h1>🎵 Recordatorio de Ensayo</h1>
    <p>Crea una imagen para compartir con el coro.</p>

    <label>Cita bíblica</label>
    <textarea id="cita">Canten al Señor un cántico nuevo,
porque ha hecho maravillas.

Salmo 98:1</textarea>

    <label>Fecha</label>
    <input id="fecha" value="Hoy viernes" />

    <label>Hora</label>
    <input id="hora" value="7:00 p.m." />

    <label>Lugar</label>
    <input id="lugar" value="Salón parroquial" />

    <h3>Elige un estilo</h3>
    <div id="estilos" class="estilos"></div>

    <button onclick="generarImagen()">Generar imagen</button>
    <button onclick="descargarImagen()" class="secundario">Descargar</button>
  </section>

  <section class="preview">
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
