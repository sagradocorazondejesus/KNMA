<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recordatorio de Ensayo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <section class="panel">
    <h1>🎵 Recordatorio de Ensayo</h1>
    <p>Genera imagen o texto para WhatsApp.</p>

    <label>Fecha</label>
    <input id="fecha" value="viernes" />

    <label>Hora</label>
    <input id="hora" value="7:00 p.m." />

    <label>Lugar</label>
    <input id="lugar" value="Nuestra Señora de Guadalupe" />

    <label>Cita bíblica</label>
    <textarea id="cita">(Salmo 98, 1).

Canten al Señor
un cántico nuevo,
porque ha hecho
maravillas.

</textarea>

    <label>Mensaje final</label>
    <input id="fraseFinal" value="¡Tu presencia hace la diferencia! 🎶" />

    <h3>Estilo de imagen</h3>
    <div id="estilosImagen" class="opciones"></div>

    <h3>Formato de texto</h3>
    <div id="estilosTexto" class="opciones"></div>

    <button onclick="generarTodo()">Actualizar</button>
    <button onclick="descargarImagen()" class="secundario">Descargar imagen</button>
    <button onclick="copiarTexto()" class="whatsapp">Copiar texto WhatsApp</button>
  </section>

  <section class="salida">
    <div class="preview">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </div>

    <div class="texto-box">
      <h2>Mensaje para WhatsApp</h2>
      <textarea id="mensajeWhatsApp" readonly></textarea>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
